[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialchoicelab"
version = "0.3.0"
description = "Spatial social choice analysis: winsets, majority preference, voting rules, and more."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "cffi>=1.15",
    "numpy>=1.23",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-material>=9.0",
    "mkdocs-jupyter>=0.24",
    "pymdown-extensions>=10,<11",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/socialchoicelab"]
# Scenario JSON is git-ignored by the repo-wide *.json rule; artifacts
# includes it in the wheel anyway.
artifacts = ["src/socialchoicelab/data/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["old_codebases"]
